[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recsys"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Data
    "psycopg2-binary",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas",
    "numpy",
    # ML
    "torch",
    "lightgbm",
    "scikit-learn",
    "implicit",
    "faiss-cpu",
    # Feature store
    "feast[postgres,redis]==0.65.0",
    # Tracking
    "mlflow",
    # Orchestration
    "prefect",
    # Serving
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "httpx",
    "pyjwt[crypto]>=2.8",
    # Monitoring
    "evidently",
    "prometheus-client",
    # Config
    "pydantic-settings",
    # DVC
    "dvc[s3]",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "types-redis",
    # The rate limiter's token bucket is a Lua script (ADR 0014), and a script
    # nothing in the suite executes is a script nobody has read. The `lua`
    # extra pulls lupa, a real Lua interpreter, so `tests/unit/test_ratelimit.py`
    # runs the shipped script rather than a Python paraphrase of it — including
    # `redis.call('TIME')`, which is the part that makes four workers agree. A
    # dev extra rather than a runtime one: the API image installs `redis` and
    # nothing else new.
    "fakeredis[lua]>=2.30,<3",
    # notebooks/eda.py renders the figures docs/eda.md embeds. A dev extra
    # rather than a runtime dependency: nothing that serves a request draws a
    # chart, and the API image is on a size budget CI enforces.
    "matplotlib>=3.10,<4",
    # The deployment tests parse docker-compose.prod.yml and the GitHub
    # workflows. PyYAML has always been installed here transitively (mlflow,
    # prefect, dvc and feast all pull it), which is exactly why it is named:
    # a test suite whose imports depend on somebody else's dependency tree
    # fails the day that tree changes, and fails as a collection error.
    "PyYAML",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
