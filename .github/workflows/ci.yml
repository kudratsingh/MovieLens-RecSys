name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  demo-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged demo Compose model
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --quiet
      - name: Verify required demo services
        run: |
          services=$(docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --services)
          for service in postgres redis pgbouncer keycloak-postgres keycloak demo-setup feature-setup feature-server model-server api api-load k6 web; do
            grep -qx "$service" <<< "$services" || {
              echo "Missing required demo service: $service"
              exit 1
            }
          done
      - name: Verify pinned k6 image
        run: |
          version=$(tr -d '[:space:]' < infra/ci/k6-version)
          image=$(K6_VERSION="$version" docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --images | grep '^grafana/k6:')
          test "$image" = "grafana/k6:$version"
      - name: Build API runtime image
        run: docker build --tag movielens-api-ci --file infra/api/Dockerfile .
      - name: Verify API runtime imports and size budget
        run: |
          docker run --rm movielens-api-ci python -c \
            "import alembic, fastapi, httpx, jwt, psycopg2, pydantic_settings, sqlalchemy"
          size=$(docker image inspect movielens-api-ci --format '{{.Size}}')
          test "$size" -lt 400000000 || {
            echo "API runtime image exceeds 400 MB: $size bytes"
            exit 1
          }
      - name: Build and verify model runtime image
        run: |
          docker build --tag movielens-model-ci --file infra/features/Dockerfile .
          docker run --rm movielens-model-ci python -c \
            "import fastapi, feast, lightgbm, pandas, uvicorn; import src.serving.model_server"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the project (with dev extras) so mypy sees the real types
      # of external classes like pydantic's BaseSettings. Without this, mypy's
      # `ignore_missing_imports` makes them Any, and strict mode's
      # `disallow_subclassing_any` fires on every legitimate subclass.
      - run: pip install -e ".[dev]"
      - run: ruff check src/ synthetic/ tests/ notebooks/
      - run: black --check src/ synthetic/ tests/ notebooks/
      - run: mypy src/ synthetic/ notebooks/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v || [ $? -eq 5 ]

  feature-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Start feature stores
        run: docker compose up -d --wait postgres redis
      - name: Prepare features and learned serving artifacts
        run: |
          python -m src.data.demo_setup
          python -c "from synthetic.personas.seed import main; main()"
          python -m src.training.demo_artifacts
      - run: pytest tests/feature_parity/ tests/learned_serving/ -v

  # Non-negotiable #9: no code path may return one tenant's data in
  # response to another tenant's request. This job boots the full
  # compose stack (Postgres + pgBouncer + Keycloak), runs the Alembic
  # migrations so RLS policies are in place, then exercises the
  # tenant-isolation suite. Triggered on any PR touching src/serving/,
  # src/auth/, migrations, or the compose stack.
  tenant-isolation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Bring up only the services the tenant-isolation test needs.
      # MLflow / Grafana / Prometheus are irrelevant here and add
      # ~30s to job time if included.
      - name: Start compose stack
        run: docker compose up -d postgres keycloak-postgres keycloak pgbouncer

      # Wait for readiness. Keycloak's cold start is the long pole
      # (~15 s on modern GitHub runners); pgBouncer + Postgres are
      # sub-second.
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/realms/default > /dev/null; then
              echo "Keycloak ready"; exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready"; exit 1

      # Create empty base tables. In dev the ingest path
      # (`make data-ingest`) creates ratings/movies/tags/links as a
      # side effect of loading the 25M CSVs; CI skips ingest because
      # it doesn't have the DVC-tracked data. Migration 0003 does
      # `ALTER TABLE ratings ADD COLUMN tenant_id`, so the base
      # tables must exist first. `create_tables` is idempotent
      # (SQLAlchemy uses CREATE TABLE IF NOT EXISTS internally).
      - name: Create empty base tables
        run: |
          python -c "
          from sqlalchemy import create_engine
          from src.config import Settings
          from src.data.schema import create_tables
          create_tables(create_engine(Settings().database_url))
          print('Base tables created.')
          "

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run tenant-isolation suite
        run: pytest tests/tenant_isolation/ -v

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs postgres || true
          docker compose logs pgbouncer || true
          docker compose logs keycloak || true

  # Non-negotiables #4 and #11: enforce the end-to-end p99 SLO against
  # real Keycloak auth, RLS audit persistence, learned warm traffic, and the
  # cold-start fallback. k6 thresholds are the job's pass/fail contract.
  synthetic-load-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start repeatable demo dependencies
        run: make demo-up

      - name: Seed personas, Feast features, and learned artifacts
        run: make demo-seed

      - name: Run 60-second authenticated k6 SLO gate
        run: make demo-load-smoke

      - name: Dump serving logs on failure
        if: failure()
        run: make demo-logs
