name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  demo-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate merged demo Compose model
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --quiet
      - name: Verify required demo services
        run: |
          services=$(docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --services)
          for service in postgres redis pgbouncer keycloak-postgres keycloak demo-setup feature-setup feature-server model-server api api-load k6 web; do
            grep -qx "$service" <<< "$services" || {
              echo "Missing required demo service: $service"
              exit 1
            }
          done
      # The CI load overlay's whole claim is that Postgres's data directory is
      # on tmpfs and the named volume is gone. Compose merges `volumes` by
      # target, so an edit on either side of that merge could quietly restore
      # the volume over the tmpfs and leave the gate measuring the runner's disk
      # again while looking unchanged. Cheap to assert here; expensive to
      # discover from a load run.
      - name: Verify the CI load overlay keeps Postgres off the runner's disk
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml \
            -f docker-compose.ci-load.yml --profile load config --format json \
            | python3 -c '
          import json, sys
          postgres = json.load(sys.stdin)["services"]["postgres"]
          mounts = {v["target"]: v["type"] for v in postgres.get("volumes", [])}
          assert mounts.get("/var/lib/postgresql/data") == "tmpfs", mounts
          assert "volume" not in mounts.values(), mounts
          print("postgres data directory:", mounts)'

      - name: Verify pinned k6 image
        run: |
          version=$(tr -d '[:space:]' < infra/ci/k6-version)
          image=$(K6_VERSION="$version" docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile load config --images | grep '^grafana/k6:')
          test "$image" = "grafana/k6:$version"
      - name: Build API runtime image
        run: docker build --tag movielens-api-ci --file infra/api/Dockerfile .
      - name: Verify API runtime imports and size budget
        run: |
          docker run --rm movielens-api-ci python -c \
            "import alembic, fastapi, httpx, jwt, psycopg2, pydantic_settings, sqlalchemy"
          size=$(docker image inspect movielens-api-ci --format '{{.Size}}')
          test "$size" -lt 400000000 || {
            echo "API runtime image exceeds 400 MB: $size bytes"
            exit 1
          }
      # ENVIRONMENT=dev is not decoration: the image bakes
      # `ENV ENVIRONMENT=production` so a deployment that forgets the variable
      # fails closed, and importing src.serving.model_server builds Settings(),
      # which refuses the default dev model-server token outside dev. The probe
      # is checking that the runtime's imports resolve, not that a production
      # credential set is present.
      - name: Build and verify model runtime image
        run: |
          docker build --tag movielens-model-ci --file infra/features/Dockerfile .
          docker run --rm -e ENVIRONMENT=dev movielens-model-ci python -c \
            "import fastapi, feast, lightgbm, pandas, uvicorn; import src.serving.model_server"

      # The production stack has never been booted by any job, so `config` is
      # the cheapest place to learn that its model is even valid. Every
      # credential in that file is a `${VAR:?...}`, so this is also the check
      # that the committed example is a *complete* variable contract: a
      # variable the example forgot fails here rather than at `make up-prod`.
      # The example stands in for the operator's gitignored `.env.prod`, which
      # CI has no business generating.
      - name: Validate production Compose model
        run: |
          docker compose --env-file infra/deploy/production.env.example \
            -f docker-compose.prod.yml config --quiet

      # R-1's premise, asserted rather than remembered: the production stack
      # does not carry the auth bypass at all — absent, not "false", so a typo
      # during an incident cannot turn it back on.
      - name: Verify the production model declares no auth bypass
        run: |
          rendered=$(docker compose --env-file infra/deploy/production.env.example \
            -f docker-compose.prod.yml config)
          if grep -q "DEV_AUTH_BYPASS" <<< "$rendered"; then
            echo "docker-compose.prod.yml names DEV_AUTH_BYPASS; production carries no such variable"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ui
      - name: Keep the Playwright traces and screenshots when the fixture suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright
          path: web/test-results/
          if-no-files-found: ignore

  browser-auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start bypass-disabled browser demo
        run: docker compose -p movielens-browser-e2e -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait --wait-timeout 180 api web
      - name: Wait for imported demo realm
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/realms/demo/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak demo realm did not become ready"
          exit 1
      - name: Seed deterministic browser personas
        run: docker compose -p movielens-browser-e2e -f docker-compose.yml -f docker-compose.demo.yml run --rm demo-setup python -c "from synthetic.personas.seed import main; main()"
      - name: Prove Keycloak PKCE session, protected API access, and the Discover journey
        run: npm run test:e2e
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
      # Browser timing is measured separately from the k6 API numbers and must
      # never be quoted for them. Runs after the journeys so a timing
      # measurement can never be blamed for a journey failure, on the mobile
      # profile pinned in playwright.perf.config.ts. CLS and the structural
      # promises (reserved posters, lazy below-fold images, bounded catalog
      # pages, no per-card TMDB fan-out, deferred technical data) are enforced;
      # LCP is enforced; the acknowledgement budget is advisory until runner
      # data exists. Adds ~20 s.
      - name: Measure browser timing on the agreed mobile profile
        run: npm run test:perf
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
      - name: Upload browser-timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-timing
          path: artifacts/browser-timing/
          if-no-files-found: warn
      - name: Print browser-auth service logs on failure
        if: failure()
        run: docker compose -p movielens-browser-e2e -f docker-compose.yml -f docker-compose.demo.yml logs --tail 300 web api keycloak
      - name: Stop browser-auth demo
        if: always()
        run: docker compose -p movielens-browser-e2e -f docker-compose.yml -f docker-compose.demo.yml down --volumes --remove-orphans

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the project (with dev extras) so mypy sees the real types
      # of external classes like pydantic's BaseSettings. Without this, mypy's
      # `ignore_missing_imports` makes them Any, and strict mode's
      # `disallow_subclassing_any` fires on every legitimate subclass.
      - run: pip install -e ".[dev]"
      - run: ruff check src/ synthetic/ tests/ notebooks/
      - run: black --check src/ synthetic/ tests/ notebooks/
      - run: mypy src/ synthetic/ notebooks/
      - run: python -m scripts.generate_openapi --check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v || [ $? -eq 5 ]

  feature-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Start feature stores
        run: docker compose up -d --wait postgres redis
      - name: Prepare features and learned serving artifacts
        run: |
          python -m src.data.demo_setup
          python -c "from synthetic.personas.seed import main; main()"
          python -m src.training.demo_artifacts
      - run: pytest tests/feature_parity/ tests/learned_serving/ -v

  # Non-negotiable #9: no code path may return one tenant's data in
  # response to another tenant's request. This job boots the full
  # compose stack (Postgres + pgBouncer + Keycloak), runs the Alembic
  # migrations so RLS policies are in place, then exercises the
  # tenant-isolation suite. Triggered on any PR touching src/serving/,
  # src/auth/, migrations, or the compose stack.
  tenant-isolation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Bring up only the services the tenant-isolation test needs.
      # MLflow / Grafana / Prometheus are irrelevant here and add
      # ~30s to job time if included.
      - name: Start compose stack
        run: docker compose up -d postgres keycloak-postgres keycloak pgbouncer

      # Wait for readiness. Keycloak's cold start is the long pole
      # (~15 s on modern GitHub runners); pgBouncer + Postgres are
      # sub-second.
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 60); do
            if curl -sSf http://localhost:8080/realms/default > /dev/null; then
              echo "Keycloak ready"; exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready"; exit 1

      # Create empty base tables. In dev the ingest path
      # (`make data-ingest`) creates ratings/movies/tags/links as a
      # side effect of loading the 25M CSVs; CI skips ingest because
      # it doesn't have the DVC-tracked data. Migration 0003 does
      # `ALTER TABLE ratings ADD COLUMN tenant_id`, so the base
      # tables must exist first. `create_tables` is idempotent
      # (SQLAlchemy uses CREATE TABLE IF NOT EXISTS internally).
      - name: Create empty base tables
        run: |
          python -c "
          from sqlalchemy import create_engine
          from src.config import Settings
          from src.data.schema import create_tables
          create_tables(create_engine(Settings().database_url))
          print('Base tables created.')
          "

      - name: Apply Alembic migrations
        run: alembic upgrade head

      # A skip and a pass are the same green tick in a job summary, and this is
      # the suite for the bug class the project calls highest-severity. The
      # conftest skips itself when no stack answers on localhost:8080; this
      # switch turns that skip into a collection failure naming the switch, so
      # a stack that failed to come up above can never be reported as isolation
      # proven.
      - name: Run tenant-isolation suite
        env:
          REQUIRE_TENANT_ISOLATION_STACK: "1"
        run: pytest tests/tenant_isolation/ -v

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs postgres || true
          docker compose logs pgbouncer || true
          docker compose logs keycloak || true

  # Non-negotiables #4 and #11: enforce the end-to-end p99 SLO against
  # real Keycloak auth, RLS audit persistence, learned warm traffic, and the
  # cold-start fallback. k6 thresholds are the job's pass/fail contract.
  synthetic-load-smoke:
    runs-on: ubuntu-latest
    needs: test
    # Postgres's data directory runs on tmpfs for this job and no other. Every
    # request commits a durable audit row before it answers, so the runner's
    # block device is otherwise inside every percentile this job measures — and
    # runner disks differ from each other by more than the whole SLO (ADR 0010,
    # 2026-08-28). Set at job level because it has to apply to every demo-*
    # target below, seeding included: a tmpfs data directory starts empty.
    env:
      DEMO_COMPOSE_EXTRA: -f docker-compose.ci-load.yml
    steps:
      - uses: actions/checkout@v4

      - name: Start repeatable demo dependencies
        run: make demo-up

      - name: Seed personas, Feast features, and learned artifacts
        run: make demo-seed

      # The runner's 4 vCPUs are shared by every container in the stack. Stop
      # the ones the gate does not measure so the measured p99 describes the
      # service rather than contention with the browser demo.
      - name: Free runner CPU for the measured services
        run: make demo-load-quiesce

      - name: Run 60-second authenticated k6 SLO gate
        run: make demo-load-smoke

      # What each route's fan-out, cursor continuation, Library read, mutation
      # plus immediate read, and Quick Picks sequence cost, measured per step
      # against the same warm stack. Correctness (every check, zero request
      # errors, every mutation reverted) fails this step; the per-step latency
      # budgets are reported and not enforced until runner data exists — see
      # ADR 0010's page-shaped note for the promotion rule. Adds ~70 s.
      - name: Run page-shaped load budgets
        run: make demo-load-pages

      # Request-id traceability, the auth boundary, dependency provenance,
      # bounded pages, cursor rejection, and degraded metadata: pass/fail facts
      # a percentile cannot express. Records rate limiting as not implemented.
      - name: Check serving reliability promises
        run: make demo-reliability-check

      # Uploaded on success too: a passing run is the baseline the next
      # failure gets compared against, and the per-second breakdown only means
      # something next to one.
      - name: Upload load-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-load-smoke
          path: |
            artifacts/load-smoke/
            artifacts/load-pages/
          if-no-files-found: warn

      - name: Dump serving logs on failure
        if: failure()
        run: make demo-logs

  # --- Deployment prerequisites ----------------------------------------------
  # The three jobs below gate the production release rather than the product,
  # and they are the only jobs here that do not run on every change. GitHub
  # applies `on.<event>.paths` to a whole workflow, so a per-job path filter has
  # to be computed once and consumed through `needs`: a docs-only PR should not
  # pay for a features-image build or a Keycloak boot. Every pre-existing job
  # deliberately keeps running on everything.
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      serving-artifacts: ${{ steps.filter.outputs.serving-artifacts }}
      realms: ${{ steps.filter.outputs.realms }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The filter diffs against the PR's base commit, which the default
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Decide which deployment gates this change needs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
            echo "Changed files:"
            printf '%s\n' "${changed}"
          else
            # A push to main is the squashed result of a reviewed PR. Run every
            # gate rather than infer intent from a commit range — and note that
            # the deploy workflow reads a *push* run and requires each gate to
            # have concluded successfully, so a gate that skipped itself on main
            # would block the deploy rather than speed it up.
            changed=""
          fi

          decide() {
            if [ -z "${BASE_SHA}" ] || printf '%s\n' "${changed}" | grep -Eq "$2"; then
              echo "$1=true" >> "${GITHUB_OUTPUT}"
              echo "gate $1: required"
            else
              echo "$1=false" >> "${GITHUB_OUTPUT}"
              echo "gate $1: not required by this change"
            fi
          }

          # The committed bundle is a pure function of the persona fixture, the
          # training and model code, the feature contract, the schema the
          # fixture is seeded through, and the image that builds it.
          decide serving-artifacts '^(infra/model-bundle/|infra/features/|synthetic/personas/|src/(models|training|features|data)/|src/(config|feature_contract)\.py|alembic/|alembic\.ini|Makefile|pyproject\.toml|docker-compose\.yml|\.github/workflows/ci\.yml)'
          decide realms '^(infra/keycloak/|tests/unit/test_realm_drift\.py|docker-compose\.yml|\.github/workflows/ci\.yml)'

  # Non-negotiable #5 in its first mechanical form: rebuild the committed
  # serving bundle from the fixture it was built from and fail if a single
  # manifest field moved. `make serving-artifacts-check` runs the rebuild inside
  # the linux/amd64 features image, so the architecture that publishes the
  # bundle is the architecture that checks it; this job supplies the Postgres
  # the training read goes to. Editing synthetic/personas/catalog.json without
  # rebuilding the bundle is what this job exists to turn red.
  serving-artifacts:
    runs-on: ubuntu-latest
    needs: [changed-paths, test]
    if: needs.changed-paths.outputs.serving-artifacts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Its own Compose project, so the network name the build container joins
      # is this job's and cannot collide with another job's stack.
      - name: Start the bundle's source of truth
        run: docker compose -p movielens-artifacts up -d --wait postgres

      # The bundle is a pure function of these rows: training raises
      # "tenant 'demo' has no ratings to train on" if the seed is skipped.
      # Both steps reach Postgres on localhost; the rebuild below reaches it
      # over the Compose network from inside the features image.
      - name: Seed the reviewed persona fixture
        run: |
          python -m src.data.demo_setup
          python -c "from synthetic.personas.seed import main; main()"

      - name: Rebuild the committed bundle and compare
        run: make serving-artifacts-check ARTIFACT_NETWORK=movielens-artifacts_default

      - name: Dump Postgres logs on failure
        if: failure()
        run: docker compose -p movielens-artifacts logs postgres

      - name: Stop the bundle's source of truth
        if: always()
        run: docker compose -p movielens-artifacts down --volumes --remove-orphans

  # ADR 0007's risk section promised a realm-drift check and no job has ever run
  # one. Two questions, one job. Does a Keycloak that imported the committed
  # seeds report the realms those seeds describe — import drops a property it
  # does not recognise in silence, so a seed can claim a setting no server ever
  # applied. And do the production templates keep every security-relevant
  # setting those seeds carry, or has production quietly become the looser of
  # the two? tests/unit/test_realm_drift.py answers both.
  realm-drift:
    runs-on: ubuntu-latest
    needs: [changed-paths]
    if: needs.changed-paths.outputs.realms == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # A fresh volume matters: `--import-realm` never overwrites a realm that
      # already exists, so only a first boot proves what the current seeds
      # produce.
      - name: Import the committed realm seeds
        run: docker compose -p movielens-realm-drift -f docker-compose.yml up -d keycloak

      - name: Wait for the imported realms
        run: |
          for realm in default demo; do
            imported=false
            for _ in $(seq 1 60); do
              if curl --fail --silent "http://localhost:8080/realms/${realm}" > /dev/null; then
                imported=true
                break
              fi
              sleep 2
            done
            if [ "${imported}" != true ]; then
              echo "Keycloak did not import realm ${realm}"
              exit 1
            fi
          done

      # `kc.sh export` starts a second Keycloak runtime inside the running
      # container and its management interface collides with the server's own
      # port 9000: the export still writes every file and then exits non-zero.
      # Moving that port is what makes an export usable against a live server.
      #
      # `--users skip` keeps accounts and their credential hashes out of the
      # file. Client secrets are still written in plain text, which is why the
      # export stays inside the job and is never uploaded as an artifact — the
      # comparison's verdict is in the log, and regenerating the export takes
      # half a minute.
      - name: Export the realms Keycloak actually built
        run: |
          docker compose -p movielens-realm-drift -f docker-compose.yml exec -T keycloak \
            /opt/keycloak/bin/kc.sh export --dir /tmp/realm-export --users skip \
            --http-management-port 9001
          mkdir -p artifacts/realm-export
          docker compose -p movielens-realm-drift -f docker-compose.yml cp \
            keycloak:/tmp/realm-export/. artifacts/realm-export/

      # REQUIRE_REALM_EXPORT turns "no export here" into a failure rather than a
      # skip, for the same reason the tenant-isolation job sets its switch: a
      # gate that silently executed nothing reports the same green tick as one
      # that passed.
      - name: Compare the export and the production templates against the seeds
        env:
          REALM_EXPORT_DIR: artifacts/realm-export
          REQUIRE_REALM_EXPORT: "1"
        run: pytest tests/unit/test_realm_drift.py -v

      - name: Dump Keycloak logs on failure
        if: failure()
        run: docker compose -p movielens-realm-drift -f docker-compose.yml logs --tail 200 keycloak

      - name: Stop Keycloak
        if: always()
        run: docker compose -p movielens-realm-drift -f docker-compose.yml down --volumes --remove-orphans

  # --- Release images --------------------------------------------------------
  # The production host never builds anything. It pulls, which makes this job
  # the only place the images it runs come from, and `needs` naming every other
  # job in this file is what makes "published" mean "passed everything". A red
  # gate anywhere above leaves the tags where they were and gives the deploy
  # workflow nothing new to pull.
  #
  # Two tags per image. The 40-character commit SHA is what a deploy pins and
  # what a rollback returns to; `main` is the moving convenience tag
  # docker-compose.prod.yml defaults IMAGE_TAG to, for an operator on the box
  # who wants whatever is current. Nothing here ever deletes a tag: a rollback
  # is only possible while the previous release's SHA tag still exists, which is
  # also why infra/host's prune timer removes images by age and never volumes.
  publish-images:
    needs:
      - browser-auth-e2e
      - changed-paths
      - demo-compose
      - feature-parity
      - frontend
      - lint
      - realm-drift
      - serving-artifacts
      - synthetic-load-smoke
      - tenant-isolation
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # GHCR namespaces are lowercase and this repository is `MovieLens-RecSys`,
      # so `github.repository` cannot be used verbatim. The literal is the same
      # string infra/deploy/production.env.example defaults IMAGE_REPOSITORY to,
      # and tests/unit/test_deploy_workflows.py holds the two together — a
      # publish job and a host that disagree about the namespace is a deploy
      # that pulls a tag nobody pushed.
      IMAGE_REPOSITORY: ghcr.io/kudratsingh/movielens-recsys
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      # The default `docker` driver cannot push straight to a registry, so this
      # job builds on a docker-container builder instead.
      - name: Enable a buildx builder that can push
        run: docker buildx create --name release --driver docker-container --use

      # linux/amd64 only, and stated rather than inherited: the target is a
      # Hetzner CX22 (x86-64) while the machine this repository is usually
      # developed on is arm64, and an image built on the wrong architecture
      # fails on the box rather than here.
      #
      # `--provenance=false` keeps each published reference a plain
      # single-platform image rather than an index carrying an attestation
      # manifest. Nothing on the host consumes an attestation, and a plain image
      # is what `docker compose pull` and `docker image prune` reason about
      # most predictably.
      #
      # The k6 image takes its version from the ARG default in
      # infra/k6/Dockerfile rather than a --build-arg here, because a Dockerfile
      # cannot read infra/ci/k6-version to build its own FROM line. The
      # duplicate pin is asserted in tests/unit/test_deploy_workflows.py, not
      # trusted: a canary running a different k6 than the gate quietly undoes
      # ADR 0010.
      - name: Build and push every image the production stack runs
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # name, build context, Dockerfile. Every service in
          # docker-compose.prod.yml that carries a `build:` block is here and
          # nothing else — a service missing from this table is a service the
          # box would have to build for itself.
          while read -r name context dockerfile; do
            [ -n "${name}" ] || continue
            echo "::group::${name}"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --file "${dockerfile}" \
              --tag "${IMAGE_REPOSITORY}/${name}:${IMAGE_TAG}" \
              --tag "${IMAGE_REPOSITORY}/${name}:main" \
              --push \
              "${context}"
            echo "::endgroup::"
            echo "- \`${IMAGE_REPOSITORY}/${name}\` at \`${IMAGE_TAG}\` and \`main\`" \
              >> "$GITHUB_STEP_SUMMARY"
          done <<'IMAGES'
          api . infra/api/Dockerfile
          features . infra/features/Dockerfile
          web ./web ./web/Dockerfile
          pgbouncer . infra/pgbouncer/Dockerfile
          keycloak . infra/keycloak/Dockerfile
          backup . infra/backup/Dockerfile
          k6 . infra/k6/Dockerfile
          IMAGES
