services:
  demo-setup:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    command: ["python", "-m", "src.data.demo_setup"]
    environment:
      POSTGRES_HOST: postgres
      ADMIN_USER_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    # The browser demo is not on the measured path. See `web` above.
    cpu_shares: 256
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    ports:
      - "8000:8000"
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Load traffic uses a separate multi-worker process so the browser demo and
  # k6 latency gate can scale independently. Both validate real Keycloak JWTs.
  api-load:
    profiles: ["load"]
    image: movielens-recsys/api:demo
    command:
      [
        "uvicorn",
        "src.serving.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${API_LOAD_WORKERS:-4}",
        "--no-access-log",
      ]
    # CFS weight, not a cap: it only decides who wins when the host is
    # oversubscribed, so it cannot change an uncontended measurement. On a
    # 4-vCPU CI runner shared by ~10 containers it is the difference between
    # measuring the service and measuring Keycloak's JVM.
    cpu_shares: 4096
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      feature-server:
        condition: service_healthy
      model-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  k6:
    profiles: ["load"]
    image: grafana/k6:${K6_VERSION:-2.1.0}
    command: ["run", "/scripts/recommendations.js"]
    # The generator being descheduled is itself a measurement error — it shows
    # up as dropped arrivals — so it is scheduled alongside the services it
    # measures rather than behind them.
    cpu_shares: 2048
    environment:
      BASE_URL: http://api-load:8000
      KEYCLOAK_URL: http://keycloak:8080
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
      API_WORKERS: ${API_LOAD_WORKERS:-4}
      # Where handleSummary drops the machine-readable summary, and where the
      # raw sample stream lands. The wrapper points both at a per-window
      # subdirectory so a re-measured run keeps both windows side by side.
      RESULTS_DIR: ${K6_RESULTS_DIR:-/results}
      # The 60-second smoke writes evidence to the artifact instead of pushing
      # it: remote-write is a trend feature (ADR 0010) and Prometheus is one
      # more process competing for the runner's four vCPUs during the only
      # minute that matters. `demo-load-nightly` adds it back.
      K6_OUT: ${K6_OUTPUTS:-json=/results/raw-metrics.json.gz}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: ${K6_PROMETHEUS_RW_PUSH_INTERVAL:-2m}
    volumes:
      - ./synthetic/load:/scripts:ro
      - ${LOAD_RESULTS_DIR:-./artifacts/load-smoke}:/results
    depends_on:
      api-load:
        condition: service_healthy

  feature-setup:
    build:
      context: .
      dockerfile: infra/features/Dockerfile
    image: movielens-recsys/features:demo
    command: ["python", "-m", "src.training.demo_artifacts"]
    environment:
      ADMIN_USER_DB_HOST: postgres
      REDIS_CONNECTION_STRING: redis:6379
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_TENANT_ID: demo
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
      - model_artifacts:/app/models/serving
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  feature-server:
    image: movielens-recsys/features:demo
    cpu_shares: 2048
    environment:
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6566/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  model-server:
    image: movielens-recsys/features:demo
    cpu_shares: 4096
    command:
      [
        "uvicorn",
        "src.serving.model_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6570",
        "--workers",
        "4",
        "--no-access-log",
      ]
    environment:
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    volumes:
      - feast_registry:/app/src/features/feast_repo/data:ro
      - model_artifacts:/app/models/serving:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6570/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: movielens-recsys/web:demo
    # `demo-load-quiesce` stops this during the gate; the weight is the
    # fallback for anyone who runs the load profile without quiescing.
    cpu_shares: 256
    environment:
      RECOMMENDATION_API_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-movielens-demo-auth-secret-change-outside-local-dev}
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
      APP_ORIGIN: http://localhost:3001
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8080/realms/demo
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/demo
      KEYCLOAK_CLIENT_ID: movielens-web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Scheduling weights for the services the base Compose file owns, kept in
  # this overlay so the plain `docker compose up` dev stack is unaffected.
  # Everything the request path touches outranks everything it does not.
  # Weights are relative and only bind under contention (Linux CFS); an idle
  # or roomy host schedules exactly as it did before.
  postgres:
    cpu_shares: 2048

  pgbouncer:
    cpu_shares: 2048

  redis:
    cpu_shares: 2048

  # Keycloak is a JVM the measured window barely touches: tokens are minted in
  # setup() and each worker's JWKS fetch is paid during warm-up. It stays
  # running because the gate authenticates for real, but its default heap is
  # sized off container memory (gigabytes on a CI runner) and its JIT keeps
  # compiling in the background. A small serial-GC heap and a bounded DB pool
  # keep that churn off the four vCPUs the measurement needs.
  keycloak:
    cpu_shares: 256
    environment:
      # The image's own JAVA_OPTS already selects G1; it has to be turned off
      # explicitly or the JVM refuses to start with two collectors chosen.
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:-UseG1GC -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_METRICS_ENABLED: "false"

  keycloak-postgres:
    cpu_shares: 256
    # Sized for one Keycloak with a ten-connection pool, not for a general
    # workload. The demo overlay is the only place this database is used.
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=32MB"]

  # Only the k6 remote-write receiver, and the smoke profile holds its batch
  # until after the scenario ends.
  prometheus:
    cpu_shares: 256

volumes:
  feast_registry:
  model_artifacts:
