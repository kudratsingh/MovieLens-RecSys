services:
  demo-setup:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    command: ["python", "-m", "src.data.demo_setup"]
    environment:
      # The image defaults to ENVIRONMENT=production so a deployment that
      # forgets the variable fails closed; every demo service that builds
      # Settings therefore has to opt back in to the development defaults.
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      ADMIN_USER_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    ports:
      - "8000:8000"
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Load traffic uses a separate multi-worker process so the browser demo and
  # k6 latency gate can scale independently. Both validate real Keycloak JWTs.
  api-load:
    profiles: ["load"]
    image: movielens-recsys/api:demo
    command:
      [
        "uvicorn",
        "src.serving.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${API_LOAD_WORKERS:-4}",
        "--no-access-log",
      ]
    # CFS weight, not a cap: it only decides who wins when the host is
    # oversubscribed, so it cannot change an uncontended measurement.
    #
    # Only the measured services are promoted; nothing is demoted. Shares
    # arbitrate between *runnable* tasks, so an idle neighbour consumes nothing
    # whatever its weight and demoting it buys the gate nothing — while it does
    # starve the sibling `browser-auth-e2e` job, which drives `api`, `web`, and
    # Keycloak through these same Compose files. Raising the four processes the
    # gate measures gets the ordering that matters without that cost.
    cpu_shares: 4096
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      feature-server:
        condition: service_healthy
      model-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  k6:
    profiles: ["load"]
    image: grafana/k6:${K6_VERSION:-2.1.0}
    # One generator service, two entry points. `recommendations.js` is the
    # pinned p99 gate and stays the default so nothing that invokes this
    # service without an override changes behaviour; `run_gate.sh` selects
    # `pages.js` for the page-shaped budgets.
    command: ["run", "${LOAD_SCRIPT:-/scripts/recommendations.js}"]
    # The generator being descheduled is itself a measurement error — it shows
    # up as dropped arrivals — so it is scheduled alongside the services it
    # measures rather than behind them.
    cpu_shares: 2048
    environment:
      BASE_URL: http://api-load:8000
      KEYCLOAK_URL: http://keycloak:8080
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
      API_WORKERS: ${API_LOAD_WORKERS:-4}
      # Where handleSummary drops the machine-readable summary, and where the
      # raw sample stream lands. The wrapper points both at a per-window
      # subdirectory so a re-measured run keeps both windows side by side.
      RESULTS_DIR: ${K6_RESULTS_DIR:-/results}
      # The 60-second smoke writes evidence to the artifact instead of pushing
      # it: remote-write is a trend feature (ADR 0010) and Prometheus is one
      # more process competing for the runner's four vCPUs during the only
      # minute that matters. `demo-load-nightly` adds it back.
      K6_OUT: ${K6_OUTPUTS:-json=/results/raw-metrics.json.gz}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: ${K6_PROMETHEUS_RW_PUSH_INTERVAL:-2m}
    volumes:
      - ./synthetic/load:/scripts:ro
      - ${LOAD_RESULTS_DIR:-./artifacts/load-smoke}:/results
    depends_on:
      api-load:
        condition: service_healthy

  feature-setup:
    build:
      context: .
      dockerfile: infra/features/Dockerfile
    image: movielens-recsys/features:demo
    command: ["python", "-m", "src.training.demo_artifacts"]
    environment:
      ENVIRONMENT: dev
      ADMIN_USER_DB_HOST: postgres
      REDIS_CONNECTION_STRING: redis:6379
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_TENANT_ID: demo
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
      - model_artifacts:/app/models/serving
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  feature-server:
    image: movielens-recsys/features:demo
    cpu_shares: 2048
    environment:
      # Feast's own server builds no Settings, but the whole demo stack
      # reading `dev` keeps the answer to "which environment is this?" the
      # same for every container in it.
      ENVIRONMENT: dev
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6566/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  model-server:
    image: movielens-recsys/features:demo
    cpu_shares: 4096
    command:
      [
        "uvicorn",
        "src.serving.model_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6570",
        "--workers",
        "4",
        "--no-access-log",
      ]
    environment:
      # src/serving/model_server.py builds Settings at module import with the
      # dev token below, which the image's ENVIRONMENT=production default
      # refuses. Dev says so explicitly.
      ENVIRONMENT: dev
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    volumes:
      - feast_registry:/app/src/features/feast_repo/data:ro
      - model_artifacts:/app/models/serving:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6570/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: movielens-recsys/web:demo
    environment:
      RECOMMENDATION_API_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-movielens-demo-auth-secret-change-outside-local-dev}
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
      APP_ORIGIN: http://localhost:3001
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8080/realms/demo
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/demo
      KEYCLOAK_CLIENT_ID: movielens-web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The k6 remote-write receiver, which only the nightly profile starts and
  # which nothing else in these Compose files depends on. Safe to demote; see
  # the note on the promoted services above for why nothing else is.
  prometheus:
    cpu_shares: 256

volumes:
  feast_registry:
  model_artifacts:
