services:
  demo-setup:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    command: ["python", "-m", "src.data.demo_setup"]
    environment:
      POSTGRES_HOST: postgres
      ADMIN_USER_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: movielens-recsys/api:demo
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    ports:
      - "8000:8000"
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Load traffic uses a separate multi-worker process so the browser demo and
  # k6 latency gate can scale independently. Both validate real Keycloak JWTs.
  api-load:
    profiles: ["load"]
    image: movielens-recsys/api:demo
    command:
      [
        "uvicorn",
        "src.serving.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
        "--no-access-log",
      ]
    environment:
      ENVIRONMENT: dev
      POSTGRES_HOST: postgres
      APP_USER_DB_HOST: pgbouncer
      APP_USER_DB_PORT: 5432
      ADMIN_USER_DB_HOST: postgres
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      DEV_AUTH_BYPASS: "false"
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_REPO_PATH: src/features/feast_repo
      FEAST_FEATURE_SERVER_URL: http://feature-server:6566
      MODEL_SERVER_URL: http://model-server:6570
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    depends_on:
      demo-setup:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_started
      feature-server:
        condition: service_healthy
      model-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  k6:
    profiles: ["load"]
    image: grafana/k6:${K6_VERSION:-2.1.0}
    command: ["run", "/scripts/recommendations.js"]
    environment:
      BASE_URL: http://api-load:8000
      KEYCLOAK_URL: http://keycloak:8080
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: ${K6_PROMETHEUS_RW_PUSH_INTERVAL:-2m}
    volumes:
      - ./synthetic/load:/scripts:ro
    depends_on:
      api-load:
        condition: service_healthy
      prometheus:
        condition: service_started

  feature-setup:
    build:
      context: .
      dockerfile: infra/features/Dockerfile
    image: movielens-recsys/features:demo
    command: ["python", "-m", "src.training.demo_artifacts"]
    environment:
      ADMIN_USER_DB_HOST: postgres
      REDIS_CONNECTION_STRING: redis:6379
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_TENANT_ID: demo
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
      - model_artifacts:/app/models/serving
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  feature-server:
    image: movielens-recsys/features:demo
    environment:
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
    volumes:
      - feast_registry:/app/src/features/feast_repo/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6566/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  model-server:
    image: movielens-recsys/features:demo
    command:
      [
        "uvicorn",
        "src.serving.model_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6570",
        "--workers",
        "4",
        "--no-access-log",
      ]
    environment:
      REDIS_CONNECTION_STRING: redis:6379
      FEAST_POSTGRES_HOST: postgres
      FEAST_POSTGRES_PORT: 5432
      FEAST_POSTGRES_DB: movielens
      FEAST_POSTGRES_USER: admin_user
      FEAST_POSTGRES_PASSWORD: admin_user
      MODEL_ARTIFACT_DIR: /app/models/serving
      MODEL_SERVER_AUTH_TOKEN: dev-model-server-token
    volumes:
      - feast_registry:/app/src/features/feast_repo/data:ro
      - model_artifacts:/app/models/serving:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6570/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: movielens-recsys/web:demo
    environment:
      RECOMMENDATION_API_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-movielens-demo-auth-secret-change-outside-local-dev}
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
      APP_ORIGIN: http://localhost:3001
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8080/realms/demo
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/demo
      KEYCLOAK_CLIENT_ID: movielens-web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  feast_registry:
  model_artifacts:
